name: Test APK

# A test build of the LHW app that installs on any Android phone (M1 FE-2).
# See "Test APK: install the app on any phone" in docs/local-setup.md.
# Testers can type the server address on its sign-in screen and it allows plain
# HTTP, so the app can reach the API on a laptop on the same Wi-Fi. It also
# shows the Phase 0 checks.
# It is signed with a debug key, never a build for LHWs: their builds use one
# HTTPS address fixed at build time (M1 FE-2).
#
# The APK is attached to the run as an artifact. It starts with the staging
# server (docs/staging.md). "Run workflow" can set another starting address, and
# so can the repository variable MEDIQORE_API_BASE_URL.

on:
  push:
    branches: [dev]
    paths:
      - 'mobile/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Server address the app starts with; empty for the staging server (testers can change it on the sign-in screen)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: test APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The same debug key for every build, so a new test APK installs over the
      # old one and keeps the phone's data. The key is made here once and kept
      # in the Actions cache, never in git. When the cache expires (7 days
      # without a build), the next APK has a new key and the old app must be
      # uninstalled first. The build reads it through ANDROID_USER_HOME.
      - name: Reuse the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android-mediqore/debug.keystore
          key: mediqore-test-apk-debug-keystore-v2

      - name: Make the debug signing key if the cache had none
        run: |
          mkdir -p ~/.android-mediqore
          if [ ! -f ~/.android-mediqore/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android-mediqore/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore ~/.android-mediqore/debug.keystore -storepass android | grep -i fingerprint

      - name: Install dependencies
        run: flutter pub get

      - name: Build the test APK
        env:
          MEDIQORE_ALLOW_HTTP: 'true'
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          VAR_API_BASE_URL: ${{ vars.MEDIQORE_API_BASE_URL }}
        run: |
          API_BASE_URL="${INPUT_API_BASE_URL:-${VAR_API_BASE_URL:-https://mediqore-staging.onrender.com/api/v1}}"
          echo "The app starts with the server address $API_BASE_URL"
          export ANDROID_USER_HOME="$HOME/.android-mediqore"
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MEDIQORE_TEST_BUILD=true
          mkdir -p build/test-apk
          cp build/app/outputs/flutter-apk/app-release.apk "build/test-apk/mediqore-test-${GITHUB_SHA::7}.apk"
          ls -l build/test-apk
          # The signing certificate: the same in every build while the cached key lasts.
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs build/test-apk/*.apk | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: mediqore-test-apk-${{ github.sha }}
          path: mobile/build/test-apk/*.apk
          if-no-files-found: error
          retention-days: 30
