name: Test APK

# A test build of the LHW app that installs on any Android phone (M1 FE-2).
# See "Test APK: install the app on any phone" in docs/local-setup.md.
# Testers can change the server address (press and hold the logo on the
# sign-in screen) and it allows plain HTTP, so the app can also reach the API on
# a laptop on the same Wi-Fi. Its settings show the Phase 0 checks.
# It is signed with a debug key, never a build for LHWs: their builds use one
# HTTPS address fixed at build time (M1 FE-2).
#
# The APK is attached to the run as an artifact. It starts with the staging
# server (docs/staging.md). "Run workflow" can set another starting address, and
# so can the repository variable MEDIQORE_API_BASE_URL.

on:
  push:
    branches: [dev]
    paths:
      - 'mobile/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Server address the app starts with; empty for the staging server (testers can change it on the sign-in screen)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: test APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      # A repository secret preserves the original test key beyond cache expiry.
      # The existing cache remains usable during migration to that secret.
      - name: Restore the existing test signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android-mediqore/debug.keystore
          key: mediqore-test-apk-debug-keystore-v2

      - name: Prepare the existing test signing key
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.MEDIQORE_TEST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android-mediqore"
          if [ -n "$TEST_KEYSTORE_BASE64" ]; then
            printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android-mediqore/debug.keystore"
          fi
          if [ ! -s "$HOME/.android-mediqore/debug.keystore" ]; then
            echo "::error::The original test signing key is unavailable. Restore it as MEDIQORE_TEST_KEYSTORE_BASE64. Building with a replacement key would prevent updates to installed apps."
            exit 1
          fi
          keytool -exportcert -keystore "$HOME/.android-mediqore/debug.keystore" \
            -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/mediqore-test-cert.der"
          sha256sum "$RUNNER_TEMP/mediqore-test-cert.der" | cut -d' ' -f1 > "$RUNNER_TEMP/mediqore-test-cert.sha256"

      - name: Install dependencies
        run: flutter pub get

      - name: Build the test APK
        env:
          MEDIQORE_ALLOW_HTTP: 'true'
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          VAR_API_BASE_URL: ${{ vars.MEDIQORE_API_BASE_URL }}
        run: |
          API_BASE_URL="${INPUT_API_BASE_URL:-${VAR_API_BASE_URL:-https://mediqore-staging.onrender.com/api/v1}}"
          echo "The app starts with the server address $API_BASE_URL"
          export ANDROID_USER_HOME="$HOME/.android-mediqore"
          export MEDIQORE_TEST_KEYSTORE="$ANDROID_USER_HOME/debug.keystore"
          set -o pipefail
          if ! flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MEDIQORE_TEST_BUILD=true 2>&1 | tee "$RUNNER_TEMP/mediqore-apk-build.log"; then
            python3 - "$RUNNER_TEMP/mediqore-apk-build.log" <<'PYERR'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          for line in lines[-55:]:
              if line.strip():
                  print("::error::" + line.replace("%", "%25").replace("\r", "%0D"))
          PYERR
            exit 1
          fi
          mkdir -p build/test-apk
          cp build/app/outputs/flutter-apk/app-release.apk "build/test-apk/mediqore-test-${GITHUB_SHA::7}.apk"
          ls -l build/test-apk
          APK_SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APK_SIGNER" verify --print-certs build/test-apk/*.apk > "$RUNNER_TEMP/mediqore-apk-cert.txt"
          EXPECTED_CERT="$(cat "$RUNNER_TEMP/mediqore-test-cert.sha256")"
          ACTUAL_CERT="$(sed -n 's/^.*certificate SHA-256 digest: *//p' "$RUNNER_TEMP/mediqore-apk-cert.txt" | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK signer does not match the retained key. Expected $EXPECTED_CERT, received $ACTUAL_CERT."
            exit 1
          fi
          printf 'Test APK signing certificate SHA-256 %s\n' "$ACTUAL_CERT"

      - uses: actions/upload-artifact@v4
        with:
          name: mediqore-test-apk-${{ github.sha }}
          path: mobile/build/test-apk/*.apk
          if-no-files-found: error
          retention-days: 30
