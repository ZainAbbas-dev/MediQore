name: Labels

# Creates or updates the repository labels listed in .github/labels.yml.

on:
  push:
    branches: [main, dev]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yq -o=json '.' .github/labels.yml | jq -c '.[]' | while read -r label; do
            name=$(jq -r '.name' <<<"$label")
            color=$(jq -r '.color' <<<"$label")
            description=$(jq -r '.description' <<<"$label")
            gh label create "$name" --color "$color" --description "$description" --force --repo "$GITHUB_REPOSITORY"
          done
