  <style>@font-face{font-family:'Jameel Noori Nastaleeq';src:url('../../../mobile/assets/fonts/JameelNooriNastaleeq.ttf');}</style>
  <rect width="360" height="780" fill="#F5F7F6"/>
  <rect x="0" y="0" width="360" height="56" rx="0" fill="#00695C"/>
  <text x="344" y="37" font-family="'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif" font-size="22" fill="#fff" text-anchor="end" font-weight="normal">سائن ان</text>
  <text x="180.0" y="150" font-family="'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif" font-size="30" fill="#00695C" text-anchor="middle" font-weight="bold">MediQore</text>
  <text x="180.0" y="190" font-family="'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif" font-size="18" fill="#5F6B76" text-anchor="middle" font-weight="normal">لیڈی ہیلتھ ورکر</text>
  <text x="344" y="250" font-family="'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif" font-size="17" fill="#1F2933" text-anchor="end" font-weight="normal">یوزر نیم (ایل ایچ ڈبلیو آئی ڈی)</text>
  <rect x="16" y="262" width="328" height="48" rx="10" fill="#fff" stroke="#C9D3D6" stroke-width="1.5"/>
  <text x="30" y="293" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="18" fill="#1F2933" text-anchor="start" font-weight="normal">LHW-001</text>
  <text x="344" y="342" font-family="'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif" font-size="17" fill="#1F2933" text-anchor="end" font-weight="normal">پاس ورڈ</text>
  <rect x="16" y="354" width="328" height="48" rx="10" fill="#fff" stroke="#C9D3D6" stroke-width="1.5"/>
  <text x="30" y="385" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="18" fill="#1F2933" text-anchor="start" font-weight="normal">••••••••</text>
  <rect x="16" y="430" width="328" height="58" rx="12" fill="#00695C"/>
  <text x="180.0" y="468" font-family="'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="normal">سائن ان کریں</text>
  <rect x="16" y="510" width="328" height="66" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="332" y="538" font-family="'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif" font-size="15" fill="#8A4B00" text-anchor="end" font-weight="normal">پہلی بار سائن ان کے لیے انٹرنیٹ ضروری ہے</text>
  <text x="332" y="562" font-family="'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif" font-size="15" fill="#8A4B00" text-anchor="end" font-weight="normal">اس کے بعد ایپ بغیر انٹرنیٹ کے کھلے گی</text>
  <line x1="16" y1="682" x2="344" y2="682" stroke="#C9D3D6" stroke-dasharray="4 3"/>
  <text x="16" y="700" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#5F6B76" text-anchor="start" font-weight="normal">States: wrong password · first login offline ·</text>
  <text x="16" y="716" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#5F6B76" text-anchor="start" font-weight="normal">account deactivated. Then the OTP screen (channel: P0-11).</text>
  <text x="16" y="732" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#5F6B76" text-anchor="start" font-weight="normal">M1 FE-2, LI-8: later logins unlock the phone database offline.</text>
