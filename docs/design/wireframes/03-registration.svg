  <style>@font-face{font-family:'Jameel Noori Nastaleeq';src:url('../../../mobile/assets/fonts/JameelNooriNastaleeq.ttf');}</style>
  <rect width="360" height="1280" fill="#F5F7F6"/>
  <rect x="0" y="0" width="360" height="56" rx="0" fill="#00695C"/>
