  <line x1="16" y1="1028" x2="344" y2="1028" stroke="#C9D3D6"/>
  <rect x="16" y="1038" width="328" height="52" rx="10" fill="#E0F2F1" stroke="#00695C" stroke-width="1.5"/>
  <text x="180.0" y="1072" font-family="'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif" font-size="18" fill="#00695C" text-anchor="middle" font-weight="normal">جی پی ایس لوکیشن لیں</text>
  <rect x="16" y="1110" width="328" height="58" rx="12" fill="#00695C"/>
  <text x="180.0" y="1148" font-family="'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="normal">محفوظ کریں</text>
  <line x1="16" y1="1188" x2="344" y2="1188" stroke="#C9D3D6" stroke-dasharray="4 3"/>
  <text x="16" y="1206" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#5F6B76" text-anchor="start" font-weight="normal">Scrolling form: one tall frame. Numbers (age, phone) stay LTR.</text>
  <text x="16" y="1222" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#5F6B76" text-anchor="start" font-weight="normal">After save: Patient ID = LHW code + local counter (M2 FE-1),</text>
  <text x="16" y="1238" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#5F6B76" text-anchor="start" font-weight="normal">saved on the phone and synced later. Decide: history as step 2?</text>
