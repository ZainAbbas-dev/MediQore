  <text x="344" y="824" font-family="'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif" font-size="17" fill="#1F2933" text-anchor="end" font-weight="normal">آپریشن سے پیدائش (سی سیکشن)</text>
