openapi: 3.1.0
info:
  title: MediQore REST API
  version: 0.5.0
  description: |
    REST API for the MediQore LHW app and the supervisor/admin portal (roadmap P0-3, P0-6; Phase 1 Module 1: M1 FE-1–3; M3 FE-2).

    Conventions (see CLAUDE.md):
    - Every route is under `/api/v1` and exchanges JSON.
    - Every request body is validated with Joi before any database call.
    - Errors always use the `Error` shape below.
    - Authentication is a short-lived JWT access token plus a refresh token (M1 FE-2). Every route
      requires the access token by default; public routes such as /health and /auth/* set `security: []`.
    - The app signs in with its installation ID. A phone that has not been approved answers
      `otp_required` until the user types the one-time code an admin or supervisor issued for it
      (decision 0002, channel `admin_issued`). LHWs can only sign in through the app.
    - Failed sign-ins are rate-limited per client address and username (429 TOO_MANY_ATTEMPTS with Retry-After).
    - HTTPS only in production: plain HTTP is refused with 403 HTTPS_REQUIRED.
    - Records are scoped by area: an LHW sees only her area, a supervisor only their assigned areas.

    Document every new route here in the same pull request that adds it.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
# Routes need a JWT unless they say otherwise (security: [] marks a public route).
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service health
  - name: Auth
    description: Sign-in (M1 FE-2)
  - name: Sync
    description: Offline sync between the LHW app and the server (M3 FE-2)
  - name: Households
    description: Households for the supervisor portal (M2 FE-3, M10 FE-1)
  - name: Women
    description: Registered women for the supervisor portal (M2 FE-1, FE-2, M10 FE-1)
  - name: Conflicts
    description: The supervisor's sync conflict review queue (M3 FE-2, M10 base)
  - name: Dashboard
    description: Dashboard counts (M10 FE-1, Phase 1 base)
  - name: Admin
    description: LHW accounts, managed by admins (M1 FE-1, FE-3)
  - name: Devices
    description: Phones waiting for approval and their one-time codes (M1 FE-2)
paths:
  /health:
    get:
      tags: [System]
      summary: API liveness check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with username and password
      description: |
        Portal sign-ins (supervisors and admins) send no deviceId. The app always sends its installation
        ID: an approved phone gets tokens at once; a new phone is registered as pending and gets 202
        `otp_required`. LHWs must send a deviceId. Every attempt writes an audit row.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 100
                password:
                  type: string
                  maxLength: 200
                deviceId:
                  type: string
                  format: uuid
                  description: The app's installation ID (UUID v4). Required for LHWs.
                deviceModel:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '202':
          description: Password correct, but this phone needs its one-time code (POST /auth/otp/verify).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequired'
        '400':
          description: VALIDATION_ERROR, or DEVICE_REQUIRED for an LHW without a deviceId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Wrong username or password (INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCOUNT_INACTIVE (deactivated; only after a correct password) or DEVICE_NOT_ALLOWED (the phone belongs to another account or is blocked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Approve this phone with its one-time code and sign in
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, deviceId, code]
              properties:
                username:
                  type: string
                password:
                  type: string
                deviceId:
                  type: string
                  format: uuid
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: The phone is approved and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: OTP_INVALID (wrong code; attempts are counted), OTP_LOCKED (five wrong codes, the code is void) or OTP_NOT_ISSUED (no valid code for this phone).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Swap a refresh token for a new access and refresh token
      description: Each refresh token works once. Deactivation and password resets revoke them.
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          description: INVALID_REFRESH_TOKEN (unknown, used, expired or revoked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCOUNT_INACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out by revoking the refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out (also for an unknown token).
        '400':
          $ref: '#/components/responses/Error'

  /sync/push:
    post:
      tags: [Sync]
      summary: Push a batch of outbox records from an LHW device
      description: |
        LHW only. Applies up to 100 records in one transaction. The server sets created_by, server_seq
        and synced_at. A new record is filed under the area the device made it in (`areaId`): the LHW's
        current area, or the area she had before her last reassignment (M1 FE-3), so records made in the
        old area and synced late keep that area. Without `areaId`, the current area is used. Resending an
        identical record is harmless (status `unchanged`). A record in any other area is not changed
        (status `rejected`, reason `OUT_OF_AREA`).

        A woman needs her household, and a pregnancy or obstetric history needs its woman, already on
        the server and in the same area (`MISSING_PARENT`, `OUT_OF_AREA`), so devices push parents first.
        A record that breaks a database rule is refused on its own and the rest of the batch still
        applies: a patient ID already used (`DUPLICATE_PATIENT_ID`), a second active pregnancy for the
        same woman (`ACTIVE_PREGNANCY_EXISTS`), a second obstetric history (`DUPLICATE_RECORD`).

        A new visit for a pregnancy that already has another visit on the same day (Pakistan time) is
        not stored: it waits in the supervisor's conflict queue (status `conflict`, with `conflictId`;
        M3 FE-2, LI-7). Resending it returns the same conflict. When the supervisor decides, the visit
        reaches the device through pull: stored, or stored as deleted.
        Every create, edit and delete writes an audit row. The device is registered on first use.
      operationId: syncPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: One result per record, in the order sent.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncPushResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Not an LHW, no assigned area (NO_AREA), or the device belongs to another account (DEVICE_NOT_ALLOWED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sync/pull:
    get:
      tags: [Sync]
      summary: Pull changes in the LHW's area since a sequence number
      description: |
        LHW only. Returns records with server_seq greater than `since`, oldest first, read from one
        consistent snapshot. Store `nextSince` and send it as `since` next time; repeat while
        `hasMore` is true. Device clocks are never used for ordering (LI-7). An edit gives a record a
        new number, so a child (a woman) can arrive before its parent (her household): apply pulled
        rows without requiring the parent.
      operationId: syncPull
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Changed records.
          content:
            application/json:
              schema:
                type: object
                required: [records, nextSince, hasMore]
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncRecord'
                  nextSince:
                    type: integer
                  hasMore:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /households:
    get:
      tags: [Households]
      summary: Households visible to a supervisor or admin
      description: A supervisor sees only their assigned areas; an admin sees all. Newest first; deleted households are left out.
      operationId: listHouseholds
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Households.
          content:
            application/json:
              schema:
                type: object
                required: [households]
                properties:
                  households:
                    type: array
                    items:
                      $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /women:
    get:
      tags: [Women]
      summary: Registered women visible to a supervisor or admin
      description: |
        A supervisor sees only their assigned areas; an admin sees all. Newest first; deleted records
        are left out. Each woman comes with her household, her latest pregnancy (the active one if
        any) and her obstetric history.
      operationId: listWomen
      parameters:
        - name: search
          in: query
          description: Part of a name, patient ID, husband's name or village, ignoring case.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Registered women.
          content:
            application/json:
              schema:
                type: object
                required: [women, total]
                properties:
                  women:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegisteredWoman'
                  total:
                    type: integer
                    description: Number of matching women, which can be more than the list holds.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /conflicts:
    get:
      tags: [Conflicts]
      summary: The sync conflict review queue
      description: |
        Supervisors see their areas; admins see all. Each item has the held record and the record
        already on the server for the same day, side by side. Newest first, at most 200.
      operationId: listConflicts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, resolved, all]
            default: pending
      responses:
        '200':
          description: Conflicts.
          content:
            application/json:
              schema:
                type: object
                required: [conflicts]
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conflict'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /conflicts/{id}/resolve:
    post:
      tags: [Conflicts]
      summary: Decide a conflict
      description: |
        `keep_both` stores the held record as well. `keep_existing` stores the held record as deleted,
        so it stays on record and the phone that sent it drops it. `keep_incoming` stores the held
        record and deletes the earlier one. Nothing is overwritten; each step writes an audit row.
      operationId: resolveConflict
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  enum: [keep_both, keep_existing, keep_incoming]
      responses:
        '200':
          description: The resolved conflict.
          content:
            application/json:
              schema:
                type: object
                required: [conflict]
                properties:
                  conflict:
                    $ref: '#/components/schemas/Conflict'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: No pending or resolved conflict with this ID in the viewer's areas (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already resolved (ALREADY_RESOLVED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Dashboard counts for the viewer's areas
      description: This week starts on Monday, Pakistan time.
      operationId: dashboardSummary
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                required: [registeredWomen, visitsThisWeek, pendingConflicts]
                properties:
                  registeredWomen:
                    type: integer
                  visitsThisWeek:
                    type: integer
                  pendingConflicts:
                    type: integer
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /admin/areas:
    get:
      tags: [Admin]
      summary: Every area with its Union Council, tehsil and district
      operationId: listAreas
      responses:
        '200':
          description: Areas, ordered by district, tehsil, Union Council and name.
          content:
            application/json:
              schema:
                type: object
                required: [areas]
                properties:
                  areas:
                    type: array
                    items:
                      $ref: '#/components/schemas/AreaOption'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /admin/lhws:
    get:
      tags: [Admin]
      summary: List LHWs
      operationId: listLhws
      parameters:
        - name: search
          in: query
          description: Part of the name or LHW ID.
          schema:
            type: string
        - name: areaId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, all]
            default: all
      responses:
        '200':
          description: LHWs, ordered by LHW ID.
          content:
            application/json:
              schema:
                type: object
                required: [lhws]
                properties:
                  lhws:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lhw'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Admin]
      summary: Create an LHW (M1 FE-1)
      description: The system issues the next LHW ID (LHW-00001, ...), which is also the username, and a random password. The password is returned once and stored only as a hash.
      operationId: createLhw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, areaId]
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 100
                areaId:
                  type: string
                  format: uuid
                phone:
                  type: string
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LhwWithCredentials'
        '400':
          description: VALIDATION_ERROR or UNKNOWN_AREA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /admin/lhws/{id}:
    patch:
      tags: [Admin]
      summary: Rename an LHW, change the phone number or reassign the area (M1 FE-3)
      operationId: updateLhw
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                fullName:
                  type: string
                areaId:
                  type: string
                  format: uuid
                phone:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/LhwResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /admin/lhws/{id}/deactivate:
    post:
      tags: [Admin]
      summary: Deactivate an LHW; refresh tokens are revoked and the next sync is refused (M1 FE-3)
      operationId: deactivateLhw
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/LhwResult'
        '404':
          $ref: '#/components/responses/Error'

  /admin/lhws/{id}/activate:
    post:
      tags: [Admin]
      summary: Reactivate an LHW (M1 FE-3)
      operationId: activateLhw
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/LhwResult'
        '404':
          $ref: '#/components/responses/Error'

  /admin/lhws/{id}/reset-password:
    post:
      tags: [Admin]
      summary: Reset an LHW's password (M1 FE-3, LI-8)
      description: Returns a new password once and revokes the refresh tokens. Unsynced data on the phone becomes unreadable (LI-8), so the portal warns before calling this.
      operationId: resetLhwPassword
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The new credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LhwWithCredentials'
        '404':
          $ref: '#/components/responses/Error'

  /devices/pending:
    get:
      tags: [Devices]
      summary: Phones waiting for a one-time code
      description: Admins see every pending phone; supervisors see those of LHWs in their areas.
      operationId: listPendingDevices
      responses:
        '200':
          description: Pending phones, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingDevice'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /devices/{id}/code:
    post:
      tags: [Devices]
      summary: Issue a one-time code for a pending phone
      description: Returns a 6-digit code once (valid 24 hours); earlier unused codes for the phone stop working. Only its hash is stored, and the audit row never contains it.
      operationId: issueDeviceCode
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: The code to hand to the user.
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt, purpose, device]
                properties:
                  code:
                    type: string
                    pattern: '^[0-9]{6}$'
                  expiresAt:
                    type: string
                    format: date-time
                  purpose:
                    type: string
                    enum: [first_login, new_device]
                  device:
                    $ref: '#/components/schemas/PendingDevice'
        '404':
          description: No pending phone with this ID (or not in the supervisor's areas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error response in the standard shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyAttempts:
      description: Too many failed attempts for this username from this address (TOO_MANY_ATTEMPTS).
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LhwResult:
      description: The LHW after the change.
      content:
        application/json:
          schema:
            type: object
            required: [lhw]
            properties:
              lhw:
                $ref: '#/components/schemas/Lhw'
  schemas:
    Health:
      type: object
      required: [status, service, version, uptimeSeconds]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          example: mediqore-api
        version:
          type: string
          example: 0.1.0
        uptimeSeconds:
          type: integer
          minimum: 0

    LoginResult:
      type: object
      required: [status, accessToken, tokenType, expiresIn, refreshToken, refreshExpiresAt, user]
      properties:
        status:
          type: string
          const: ok
        accessToken:
          type: string
          description: JWT, valid for expiresIn. App tokens carry the approved phone (claim `did`).
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: string
          example: 15m
        refreshToken:
          type: string
          description: Opaque; works once with POST /auth/refresh.
        refreshExpiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required: [id, username, role, fullName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [lhw, supervisor, admin]
        fullName:
          type: string
        lhwCode:
          type: string
          description: LHWs only.
        areaId:
          type: string
          format: uuid
          description: LHWs only. The app resets its local area data when this changes.
        areaName:
          type: string
        lastPatientNumber:
          type: integer
          minimum: 0
          description: |
            LHWs only. The highest number already used in a patient ID with this LHW code (M2 FE-1),
            0 if none. The app's patient counter continues after it, so a new phone never reuses an ID.

    OtpRequired:
      type: object
      required: [status, otp]
      properties:
        status:
          type: string
          const: otp_required
        otp:
          type: object
          required: [channel]
          properties:
            channel:
              type: string
              enum: [admin_issued]

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AreaOption:
      type: object
      required: [id, name, unionCouncil, tehsil, district]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unionCouncil:
          type: string
        tehsil:
          type: string
        district:
          type: string

    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Lhw:
      type: object
      required: [id, lhwCode, username, fullName, isActive, area, devices]
      properties:
        id:
          type: string
          format: uuid
        lhwCode:
          type: string
          example: LHW-00001
        username:
          type: string
        fullName:
          type: string
        phone:
          type: [string, 'null']
        isActive:
          type: boolean
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        area:
          type: object
          required: [id, name, unionCouncil, tehsil, district]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            unionCouncil:
              $ref: '#/components/schemas/NamedRef'
            tehsil:
              $ref: '#/components/schemas/NamedRef'
            district:
              $ref: '#/components/schemas/NamedRef'
        devices:
          type: object
          required: [approved, pending]
          properties:
            approved:
              type: integer
            pending:
              type: integer

    LhwWithCredentials:
      type: object
      required: [lhw, credentials]
      properties:
        lhw:
          $ref: '#/components/schemas/Lhw'
        credentials:
          type: object
          required: [username, password]
          description: Shown to the admin once; never stored in plain text.
          properties:
            username:
              type: string
            password:
              type: string

    PendingDevice:
      type: object
      required: [id, firstSeenAt, user]
      properties:
        id:
          type: string
          format: uuid
        model:
          type: [string, 'null']
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        codeExpiresAt:
          type: [string, 'null']
          format: date-time
          description: Set while an unused code is valid.
        user:
          type: object
          required: [id, username, fullName, role]
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            fullName:
              type: string
            role:
              type: string
              enum: [lhw, supervisor, admin]
            lhwCode:
              type: [string, 'null']
            areaName:
              type: [string, 'null']

    HouseholdData:
      type: object
      description: Fields of a household (M2 FE-3). Missing or empty fields are stored as null.
      properties:
        householdNumber:
          type: [string, 'null']
          maxLength: 50
        address:
          type: [string, 'null']
          maxLength: 500
        village:
          type: [string, 'null']
          maxLength: 200
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          description: Rounded to 6 decimal places. Give latitude and longitude together.
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180

    WomanData:
      type: object
      description: A registered woman (M2 FE-1).
      required: [householdId, patientCode, name]
      properties:
        householdId:
          type: string
          format: uuid
        patientCode:
          type: string
          maxLength: 40
          pattern: '^[A-Za-z0-9-]+$'
          description: The LHW code plus a counter kept on the phone, for example LHW-00001-0007. Unique.
        name:
          type: string
          maxLength: 200
        age:
          type: [integer, 'null']
          minimum: 10
          maximum: 60
        husbandName:
          type: [string, 'null']
          maxLength: 200
        contactNumber:
          type: [string, 'null']
          maxLength: 20
          pattern: '^[0-9+\- ]+$'

    PregnancyData:
      type: object
      description: The pregnancy file (M2 FE-1). One active pregnancy per woman at a time.
      required: [womanId, registeredOn, pregnancyMonthAtRegistration]
      properties:
        womanId:
          type: string
          format: uuid
        registeredOn:
          type: string
          format: date
        pregnancyMonthAtRegistration:
          type: integer
          minimum: 1
          maximum: 10
        status:
          type: string
          enum: [active, closed]
          default: active
        closedOn:
          type: [string, 'null']
          format: date
          description: Only for a closed pregnancy.

    ObstetricHistoryData:
      type: object
      description: Obstetric history at registration, the baseline risk profile (M2 FE-2). One per woman.
      required: [womanId]
      properties:
        womanId:
          type: string
          format: uuid
        previousPregnancies:
          type: integer
          minimum: 0
          maximum: 30
          default: 0
        previousCSections:
          type: integer
          minimum: 0
          maximum: 30
          default: 0
          description: At most previousPregnancies.
        stillbirths:
          type: integer
          minimum: 0
          maximum: 30
          default: 0
          description: At most previousPregnancies.
        knownConditions:
          type: [string, 'null']
          maxLength: 1000

    VisitData:
      type: object
      description: |
        One home visit (M3 FE-1). Units are in the names and never converted in storage. The bounds
        only refuse impossible values; the app asks for confirmation of implausible ones.
      required: [pregnancyId, visitedAt]
      properties:
        pregnancyId:
          type: string
          format: uuid
        visitedAt:
          type: string
          format: date-time
          description: Device clock; shown and counted, never used to order records (LI-7).
        systolicBpMmhg:
          type: [integer, 'null']
          minimum: 20
          maximum: 300
        diastolicBpMmhg:
          type: [integer, 'null']
          minimum: 10
          maximum: 200
        weightKg:
          type: [number, 'null']
          minimum: 10
          maximum: 250
        temperatureC:
          type: [number, 'null']
          minimum: 25
          maximum: 45
        pulseBpm:
          type: [integer, 'null']
          minimum: 20
          maximum: 250
        bloodSugarMmolL:
          type: [number, 'null']
          minimum: 0.5
          maximum: 50
        fetalMovement:
          type: [string, 'null']
          enum: [normal, reduced, absent, null]
        swelling:
          type: boolean
          default: false
        bleeding:
          type: boolean
          default: false
        fever:
          type: boolean
          default: false
        anaemiaSigns:
          type: string
          enum: [none, present, severe]
          default: none
        urineSymptoms:
          type: boolean
          default: false

    Conflict:
      type: object
      required: [id, table, reason, status, createdAt, areaId, areaName, submittedBy, incoming]
      properties:
        id:
          type: string
          format: uuid
        table:
          type: string
          enum: [visits]
        reason:
          type: string
          enum: [same_parent_same_day]
        status:
          type: string
          enum: [pending, resolved]
        resolution:
          type: [string, 'null']
          enum: [keep_both, keep_existing, keep_incoming, null]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, 'null']
          format: date-time
        resolvedBy:
          type: [string, 'null']
        areaId:
          type: string
          format: uuid
        areaName:
          type: string
        submittedBy:
          type: object
          properties:
            lhwCode:
              type: [string, 'null']
            fullName:
              type: [string, 'null']
        woman:
          type: [object, 'null']
          properties:
            name:
              type: string
            patientCode:
              type: string
        incoming:
          type: object
          description: The held record as the device sent it.
          properties:
            id:
              type: string
              format: uuid
            data:
              $ref: '#/components/schemas/VisitData'
        existing:
          type: [object, 'null']
          description: The record already on the server for the same day.
          properties:
            id:
              type: string
              format: uuid
            deleted:
              type: boolean
            data:
              $ref: '#/components/schemas/VisitData'

    RecordData:
      description: The fields of the record; which schema applies depends on `table`.
      anyOf:
        - $ref: '#/components/schemas/HouseholdData'
        - $ref: '#/components/schemas/WomanData'
        - $ref: '#/components/schemas/PregnancyData'
        - $ref: '#/components/schemas/ObstetricHistoryData'
        - $ref: '#/components/schemas/VisitData'

    SyncPushRequest:
      type: object
      required: [deviceId, records]
      properties:
        deviceId:
          type: string
          format: uuid
          description: UUID v4 generated once per app installation.
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [table, id, createdOnDevice, data]
            properties:
              table:
                type: string
                enum: [households, women, pregnancies, obstetric_history, visits]
                description: Tables are added as their modules are built.
              id:
                type: string
                format: uuid
                description: UUID v4 generated on the device.
              areaId:
                type: string
                format: uuid
                description: The area the record was made in (the signed-in LHW's area at that time). Ignored for a record the server already has.
              createdOnDevice:
                type: string
                format: date-time
                description: Device clock at creation; informational only.
              deleted:
                type: boolean
                default: false
              data:
                $ref: '#/components/schemas/RecordData'

    SyncPushResult:
      type: object
      required: [table, id, status]
      properties:
        table:
          type: string
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, updated, unchanged, rejected, conflict]
        serverSeq:
          type: integer
          description: Absent when rejected or held as a conflict.
        conflictId:
          type: string
          format: uuid
          description: With status `conflict`, the item in the supervisor's queue.
        reason:
          type: string
          enum: [OUT_OF_AREA, MISSING_PARENT, DUPLICATE_PATIENT_ID, ACTIVE_PREGNANCY_EXISTS, DUPLICATE_RECORD, INVALID_VALUE]

    SyncRecord:
      type: object
      required: [table, id, areaId, serverSeq, deleted, data]
      properties:
        table:
          type: string
        id:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        serverSeq:
          type: integer
        createdOnDevice:
          type: [string, 'null']
          format: date-time
        syncedAt:
          type: string
          format: date-time
        deleted:
          type: boolean
        data:
          $ref: '#/components/schemas/RecordData'

    RegisteredWoman:
      type: object
      required: [id, patientCode, name, areaId, areaName, household, registeredBy, serverSeq, syncedAt]
      properties:
        id:
          type: string
          format: uuid
        patientCode:
          type: string
        name:
          type: string
        age:
          type: [integer, 'null']
        husbandName:
          type: [string, 'null']
        contactNumber:
          type: [string, 'null']
        areaId:
          type: string
          format: uuid
        areaName:
          type: string
        household:
          type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
            village:
              type: [string, 'null']
            address:
              type: [string, 'null']
            latitude:
              type: [number, 'null']
            longitude:
              type: [number, 'null']
        registeredBy:
          type: object
          description: The LHW who registered her.
          properties:
            lhwCode:
              type: [string, 'null']
            fullName:
              type: string
        pregnancy:
          type: [object, 'null']
          properties:
            registeredOn:
              type: string
              format: date
            monthAtRegistration:
              type: integer
            status:
              type: string
              enum: [active, closed]
        obstetricHistory:
          type: [object, 'null']
          properties:
            previousPregnancies:
              type: integer
            previousCSections:
              type: integer
            stillbirths:
              type: integer
            knownConditions:
              type: [string, 'null']
        visits:
          type: object
          description: Her home visits (M3 FE-1), deleted ones left out.
          properties:
            count:
              type: integer
            lastVisitAt:
              type: [string, 'null']
              format: date-time
        serverSeq:
          type: integer
        syncedAt:
          type: string
          format: date-time

    Household:
      type: object
      required: [id, areaId, areaName, serverSeq, syncedAt]
      properties:
        id:
          type: string
          format: uuid
        householdNumber:
          type: [string, 'null']
        village:
          type: [string, 'null']
        address:
          type: [string, 'null']
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        areaId:
          type: string
          format: uuid
        areaName:
          type: string
        serverSeq:
          type: integer
        syncedAt:
          type: string
          format: date-time
        createdOnDevice:
          type: [string, 'null']
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum:
                - VALIDATION_ERROR
                - INVALID_JSON
                - PAYLOAD_TOO_LARGE
                - NOT_FOUND
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - NO_AREA
                - DEVICE_NOT_ALLOWED
                - DEVICE_REQUIRED
                - ACCOUNT_INACTIVE
                - OTP_NOT_ISSUED
                - OTP_INVALID
                - OTP_LOCKED
                - INVALID_REFRESH_TOKEN
                - TOO_MANY_ATTEMPTS
                - HTTPS_REQUIRED
                - UNKNOWN_AREA
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              description: Present for VALIDATION_ERROR, one entry per problem.
              items:
                type: object
                required: [in, path, message]
                properties:
                  in:
                    type: string
                    enum: [params, query, body]
                  path:
                    type: string
                  message:
                    type: string
