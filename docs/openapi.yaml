openapi: 3.1.0
info:
  title: MediQore REST API
  version: 0.7.0
  description: |
    REST API for the MediQore LHW app and the supervisor/admin portal (roadmap P0-3, P0-6; Phase 1: M1 FE-1–3, M2, M3 FE-2, M10 base).

    Conventions (see CLAUDE.md):
    - Every route is under `/api/v1` and exchanges JSON.
    - Every request body is validated with Joi before any database call.
    - Errors always use the `Error` shape below.
    - Authentication is a short-lived JWT access token plus a refresh token (M1 FE-2). Every route
      requires the access token by default; public routes such as /health and /auth/* set `security: []`.
    - The app signs in with its installation ID. The first sign-in on a phone is online, with the
      username, password and the one-time activation code an admin generated (POST /auth/activate).
      After that the LHW unlocks the app offline with her PIN; the server never checks the PIN.
      LHWs can only sign in through the app (M1 FE-2).
    - Failed sign-ins are rate-limited per client address and username (429 TOO_MANY_ATTEMPTS with Retry-After).
    - HTTPS only in production: plain HTTP is refused with 403 HTTPS_REQUIRED.
    - Records are scoped by area: an LHW sees only her area, a supervisor only their assigned areas.
    - Each route checks a permission, and each permission belongs to fixed roles (M10 FE-3, see GET /admin/roles).

    Document every new route here in the same pull request that adds it.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
# Routes need a JWT unless they say otherwise (security: [] marks a public route).
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service health
  - name: Auth
    description: Sign-in (M1 FE-2)
  - name: Sync
    description: Offline sync between the LHW app and the server (M3 FE-2)
  - name: Households
    description: Households for the supervisor portal (M2 FE-3, M10 FE-1)
  - name: Women
    description: Registered women for the supervisor portal (M2 FE-1, FE-2, M10 FE-1)
  - name: Conflicts
    description: The supervisor's sync conflict review queue (M3 FE-2, M10 base)
  - name: Dashboard
    description: Dashboard counts, LHW activity and filters (M10 FE-1, Phase 1 base)
  - name: Admin
    description: LHW accounts (M1 FE-1, FE-3) and the admin panel (M10 FE-3)
  - name: Audit
    description: The audit log viewer (M10 FE-3)
  - name: PIN reset
    description: The supervisor's reply codes for an offline PIN reset (M1 FE-2)
paths:
  /health:
    get:
      tags: [System]
      summary: API liveness check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with username and password
      description: |
        Portal sign-ins (supervisors and admins) send no deviceId. The app always sends its installation
        ID, and only a phone already activated for the account gets tokens; a new phone gets 403
        ACTIVATION_REQUIRED and is activated with POST /auth/activate. The app uses this route to sign in
        again on its activated phone when its refresh token no longer works. Every attempt writes an audit row.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 100
                password:
                  type: string
                  maxLength: 200
                deviceId:
                  type: string
                  format: uuid
                  description: The app's installation ID (UUID v4). Required for LHWs.
                deviceModel:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: VALIDATION_ERROR, or DEVICE_REQUIRED for an LHW without a deviceId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Wrong username or password (INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            After a correct password: ACCOUNT_INACTIVE (deactivated), ACTIVATION_REQUIRED (this phone is not
            activated for the account yet), DEVICE_NOT_ALLOWED (the phone belongs to another account or is
            blocked) or APP_FOR_LHWS (a supervisor or admin signing in from the app).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'

  /auth/activate:
    post:
      tags: [Auth]
      summary: Activate this phone with the admin's one-time activation code and sign in (M1 FE-2)
      description: |
        The first sign-in of an LHW on a phone, online. The code is the one an admin generated for her
        (POST /admin/lhws/{id}/activation-code): 8 characters, valid 48 hours, single use. Case, spaces and
        the dash do not matter. A wrong or expired code counts as a failed sign-in. On success the phone is
        activated, the code is used up, and the reply also carries `activationSecret`, which the app keeps
        in the Android Keystore to check PIN-reset reply codes offline. It is sent only here, once.
      operationId: activate
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, activationCode, deviceId]
              properties:
                username:
                  type: string
                  maxLength: 100
                password:
                  type: string
                  maxLength: 200
                activationCode:
                  type: string
                  pattern: '^[A-Za-z0-9]{4}[\s-]?[A-Za-z0-9]{4}$'
                  example: K7QM-4R2X
                deviceId:
                  type: string
                  format: uuid
                  description: The app's installation ID (UUID v4).
                deviceModel:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: The phone is activated and signed in.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LoginResult'
                  - type: object
                    required: [activationSecret]
                    properties:
                      activationSecret:
                        type: string
                        description: 32 random-looking bytes, base64url. Store it in the Keystore; never log it.
        '400':
          description: VALIDATION_ERROR, or ACTIVATION_CODE_INVALID (wrong, expired, used or replaced code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Wrong username or password (INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCOUNT_INACTIVE, DEVICE_NOT_ALLOWED (the phone belongs to another account or is blocked) or APP_FOR_LHWS (not an LHW account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Swap a refresh token for a new access and refresh token
      description: Each refresh token works once. Deactivation and password resets revoke them. The app refreshes at every sync, which also updates its supervisor list.
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          description: INVALID_REFRESH_TOKEN (unknown, used, expired or revoked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ACCOUNT_INACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out by revoking the refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out (also for an unknown token).
        '400':
          $ref: '#/components/responses/Error'

  /sync/push:
    post:
      tags: [Sync]
      summary: Push a batch of outbox records from an LHW device
      description: |
        LHW only. Applies up to 100 records in one transaction. The server sets created_by, server_seq
        and synced_at. A new record is filed under the area the device made it in (`areaId`): the LHW's
        current area, or the area she had before her last reassignment (M1 FE-3), so records made in the
        old area and synced late keep that area. Without `areaId`, the current area is used. Resending an
        identical record is harmless (status `unchanged`). A record in any other area is not changed
        (status `rejected`, reason `OUT_OF_AREA`).

        A woman needs her household, and a pregnancy or obstetric history needs its woman, already on
        the server and in the same area (`MISSING_PARENT`, `OUT_OF_AREA`), so devices push parents first.
        A record that breaks a database rule is refused on its own and the rest of the batch still
        applies: a patient ID already used (`DUPLICATE_PATIENT_ID`), a second active pregnancy for the
        same woman (`ACTIVE_PREGNANCY_EXISTS`), a second obstetric history (`DUPLICATE_RECORD`).

        A new visit for a pregnancy that already has another visit on the same day (Pakistan time) is
        not stored: it waits in the supervisor's conflict queue (status `conflict`, with `conflictId`;
        M3 FE-2, LI-7). Resending it returns the same conflict. When the supervisor decides, the visit
        reaches the device through pull: stored, or stored as deleted.
        Every create, edit and delete writes an audit row. The device is registered on first use.
      operationId: syncPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: One result per record, in the order sent.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncPushResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Not an LHW, no assigned area (NO_AREA), or the device belongs to another account (DEVICE_NOT_ALLOWED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sync/pull:
    get:
      tags: [Sync]
      summary: Pull changes in the LHW's area since a sequence number
      description: |
        LHW only. Returns records with server_seq greater than `since`, oldest first, read from one
        consistent snapshot. Store `nextSince` and send it as `since` next time; repeat while
        `hasMore` is true. Device clocks are never used for ordering (LI-7). An edit gives a record a
        new number, so a child (a woman) can arrive before its parent (her household): apply pulled
        rows without requiring the parent.
      operationId: syncPull
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Changed records.
          content:
            application/json:
              schema:
                type: object
                required: [records, nextSince, hasMore]
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncRecord'
                  nextSince:
                    type: integer
                  hasMore:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /households:
    get:
      tags: [Households]
      summary: Households visible to a supervisor or admin
      description: A supervisor sees only their assigned areas; an admin sees all. Newest first; deleted households are left out. The dashboard map filters them (M10 FE-1).
      operationId: listHouseholds
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: districtId
          in: query
          schema:
            type: string
            format: uuid
        - name: unionCouncilId
          in: query
          schema:
            type: string
            format: uuid
        - name: lhwId
          in: query
          description: The LHW who registered the household.
          schema:
            type: string
            format: uuid
        - name: days
          in: query
          description: Time period. Households the server received in the last so many days (server time, never the phone's clock).
          schema:
            type: integer
            minimum: 1
            maximum: 366
      responses:
        '200':
          description: Households.
          content:
            application/json:
              schema:
                type: object
                required: [households]
                properties:
                  households:
                    type: array
                    items:
                      $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /women:
    get:
      tags: [Women]
      summary: Registered women visible to a supervisor or admin
      description: |
        A supervisor sees only their assigned areas; an admin sees all. Newest first; deleted records
        are left out. Each woman comes with her household, her latest pregnancy (the active one if
        any) and her obstetric history.
      operationId: listWomen
      parameters:
        - name: search
          in: query
          description: Part of a name, patient ID, husband's name or village, ignoring case.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Registered women.
          content:
            application/json:
              schema:
                type: object
                required: [women, total]
                properties:
                  women:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegisteredWoman'
                  total:
                    type: integer
                    description: Number of matching women, which can be more than the list holds.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /conflicts:
    get:
      tags: [Conflicts]
      summary: The sync conflict review queue
      description: |
        Supervisors see their areas; admins see all. Each item has the held record and the record
        already on the server for the same day, side by side. Newest first, at most 200.
      operationId: listConflicts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, resolved, all]
            default: pending
      responses:
        '200':
          description: Conflicts.
          content:
            application/json:
              schema:
                type: object
                required: [conflicts]
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conflict'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /conflicts/{id}/resolve:
    post:
      tags: [Conflicts]
      summary: Decide a conflict
      description: |
        `keep_both` stores the held record as well. `keep_existing` stores the held record as deleted,
        so it stays on record and the phone that sent it drops it. `keep_incoming` stores the held
        record and deletes the earlier one. Nothing is overwritten; each step writes an audit row.
      operationId: resolveConflict
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  enum: [keep_both, keep_existing, keep_incoming]
      responses:
        '200':
          description: The resolved conflict.
          content:
            application/json:
              schema:
                type: object
                required: [conflict]
                properties:
                  conflict:
                    $ref: '#/components/schemas/Conflict'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: No pending or resolved conflict with this ID in the viewer's areas (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already resolved (ALREADY_RESOLVED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Dashboard counts for the viewer's areas
      description: This week starts on Monday, Pakistan time.
      operationId: dashboardSummary
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                required: [registeredWomen, visitsThisWeek, pendingConflicts]
                properties:
                  registeredWomen:
                    type: integer
                  visitsThisWeek:
                    type: integer
                  pendingConflicts:
                    type: integer
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /dashboard/filters:
    get:
      tags: [Dashboard]
      summary: The districts, Union Councils and LHWs the viewer can filter by
      description: Within the supervisor's areas; every one for an admin.
      operationId: dashboardFilters
      responses:
        '200':
          description: Filter options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardFilters'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /dashboard/lhw-activity:
    get:
      tags: [Dashboard]
      summary: Visit counts, registrations, last sync and last login per LHW (M10 FE-1)
      description: Counts are by the LHW who made the records. Visit times come from the phone and are only counted; last sync is server time.
      operationId: lhwActivity
      parameters:
        - name: districtId
          in: query
          schema:
            type: string
            format: uuid
        - name: unionCouncilId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: LHWs, ordered by district, Union Council and LHW ID.
          content:
            application/json:
              schema:
                type: object
                required: [lhws]
                properties:
                  lhws:
                    type: array
                    items:
                      $ref: '#/components/schemas/LhwActivity'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /admin/areas:
    get:
      tags: [Admin]
      summary: Every area with its Union Council, tehsil and district
      operationId: listAreas
      responses:
        '200':
          description: Areas, ordered by district, tehsil, Union Council and name.
          content:
            application/json:
              schema:
                type: object
                required: [areas]
                properties:
                  areas:
                    type: array
                    items:
                      $ref: '#/components/schemas/AreaOption'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /admin/lhws:
    get:
      tags: [Admin]
      summary: List LHWs
      operationId: listLhws
      parameters:
        - name: search
          in: query
          description: Part of the name or LHW ID.
          schema:
            type: string
        - name: areaId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, all]
            default: all
      responses:
        '200':
          description: LHWs, ordered by LHW ID.
          content:
            application/json:
              schema:
                type: object
                required: [lhws]
                properties:
                  lhws:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lhw'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Admin]
      summary: Create an LHW (M1 FE-1)
      description: The system issues the next LHW ID (LHW-00001, ...), which is also the username, and a random password. The password is returned once and stored only as a hash.
      operationId: createLhw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, areaId]
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 100
                areaId:
                  type: string
                  format: uuid
                phone:
                  type: string
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LhwWithCredentials'
        '400':
          description: VALIDATION_ERROR or UNKNOWN_AREA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /admin/lhws/{id}:
    patch:
      tags: [Admin]
      summary: Rename an LHW, change the phone number or reassign the area (M1 FE-3)
      operationId: updateLhw
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                fullName:
                  type: string
                areaId:
                  type: string
                  format: uuid
                phone:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/LhwResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /admin/lhws/{id}/deactivate:
    post:
      tags: [Admin]
      summary: Deactivate an LHW; refresh tokens are revoked and the next sync is refused (M1 FE-3)
      operationId: deactivateLhw
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/LhwResult'
        '404':
          $ref: '#/components/responses/Error'

  /admin/lhws/{id}/activate:
    post:
      tags: [Admin]
      summary: Reactivate an LHW (M1 FE-3)
      operationId: activateLhw
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/LhwResult'
        '404':
          $ref: '#/components/responses/Error'

  /admin/lhws/{id}/reset-password:
    post:
      tags: [Admin]
      summary: Reset an LHW's password (M1 FE-3, LI-8)
      description: Returns a new password once and revokes the refresh tokens. The phone keeps its data and its PIN; the LHW signs in once with the new password when the app next connects.
      operationId: resetLhwPassword
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The new credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LhwWithCredentials'
        '404':
          $ref: '#/components/responses/Error'

  /admin/lhws/{id}/activation-code:
    post:
      tags: [Admin]
      summary: Generate a one-time activation code for an LHW's phone (M1 FE-1, FE-2)
      description: |
        Returns the code once, as XXXX-XXXX (8 characters without easily confused letters or digits),
        valid 48 hours, for one activation. Earlier unused codes of the LHW stop working, and so do they
        when she is deactivated. Only a bcrypt hash is stored; the audit row never contains the code.
      operationId: issueActivationCode
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: The code to hand to the LHW with her ID and password.
          content:
            application/json:
              schema:
                type: object
                required: [activationCode, expiresAt, lhw]
                properties:
                  activationCode:
                    type: string
                    pattern: '^[A-HJ-KMNP-Z2-9]{4}-[A-HJ-KMNP-Z2-9]{4}$'
                    example: K7QM-4R2X
                  expiresAt:
                    type: string
                    format: date-time
                  lhw:
                    $ref: '#/components/schemas/Lhw'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: ACCOUNT_INACTIVE (reactivate the LHW first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/staff:
    get:
      tags: [Admin]
      summary: List supervisor and admin accounts (M10 FE-3)
      operationId: listStaff
      parameters:
        - name: search
          in: query
          description: Part of the name or username.
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [supervisor, admin]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, all]
            default: all
      responses:
        '200':
          description: Accounts.
          content:
            application/json:
              schema:
                type: object
                required: [staff]
                properties:
                  staff:
                    type: array
                    items:
                      $ref: '#/components/schemas/Staff'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Admin]
      summary: Create a supervisor or admin account
      description: The admin chooses the username; the password is random, returned once and stored only as a hash. A supervisor needs at least one area.
      operationId: createStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, username, fullName]
              properties:
                role:
                  type: string
                  enum: [supervisor, admin]
                username:
                  type: string
                  pattern: '^[a-z][a-z0-9._-]{2,31}$'
                  description: Stored in lower case.
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 100
                phone:
                  type: string
                areaIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffWithCredentials'
        '400':
          description: VALIDATION_ERROR, AREAS_REQUIRED or UNKNOWN_AREA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: USERNAME_TAKEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/staff/{id}:
    patch:
      tags: [Admin]
      summary: Change the name, phone, role or areas of a supervisor or admin
      description: A role change signs the account out. An admin cannot change their own role (OWN_ACCOUNT), and the last active admin stays an admin (LAST_ADMIN). Areas are replaced by the list given.
      operationId: updateStaff
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role:
                  type: string
                  enum: [supervisor, admin]
                fullName:
                  type: string
                phone:
                  type: string
                areaIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          $ref: '#/components/responses/StaffResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /admin/staff/{id}/deactivate:
    post:
      tags: [Admin]
      summary: Deactivate a supervisor or admin; their refresh tokens are revoked
      description: Not your own account (OWN_ACCOUNT), and not the last active admin (LAST_ADMIN).
      operationId: deactivateStaff
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/StaffResult'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /admin/staff/{id}/activate:
    post:
      tags: [Admin]
      summary: Reactivate a supervisor or admin
      operationId: activateStaff
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/StaffResult'
        '404':
          $ref: '#/components/responses/Error'

  /admin/staff/{id}/reset-password:
    post:
      tags: [Admin]
      summary: Reset a supervisor's or admin's password; returned once, refresh tokens revoked
      operationId: resetStaffPassword
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The new credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffWithCredentials'
        '404':
          $ref: '#/components/responses/Error'

  /admin/roles:
    get:
      tags: [Admin]
      summary: The fixed roles and what each may do (M10 FE-3)
      description: The same permission list every route checks.
      operationId: listRoles
      responses:
        '200':
          description: Roles and permissions.
          content:
            application/json:
              schema:
                type: object
                required: [roles, permissions]
                properties:
                  roles:
                    type: array
                    items:
                      type: object
                      required: [id, label, description]
                      properties:
                        id:
                          type: string
                          enum: [lhw, supervisor, admin]
                        label:
                          type: string
                        description:
                          type: string
                  permissions:
                    type: array
                    items:
                      type: object
                      required: [id, label, roles]
                      properties:
                        id:
                          type: string
                          example: audit.view
                        label:
                          type: string
                        roles:
                          type: array
                          items:
                            type: string
                            enum: [lhw, supervisor, admin]
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /admin/geography:
    get:
      tags: [Admin]
      summary: The district > tehsil > Union Council > area tree (M10 FE-3)
      description: Deleted units are left out. Each area says how many LHWs and supervisors it has.
      operationId: geographyTree
      responses:
        '200':
          description: The tree, each level ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeographyTree'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /admin/geography/{level}:
    post:
      tags: [Admin]
      summary: Add a district, tehsil, Union Council or area
      description: Below district level, parentId is the unit above. Names are unique among siblings (case-insensitive); a name that belonged to a deleted sibling brings that unit back with its ID.
      operationId: createUnit
      parameters:
        - $ref: '#/components/parameters/Level'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                parentId:
                  type: string
                  format: uuid
      responses:
        '201':
          $ref: '#/components/responses/UnitResult'
        '400':
          description: VALIDATION_ERROR or UNKNOWN_PARENT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: DUPLICATE_NAME.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/geography/{level}/{id}:
    patch:
      tags: [Admin]
      summary: Rename a unit
      operationId: renameUnit
      parameters:
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
      responses:
        '200':
          $ref: '#/components/responses/UnitResult'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Admin]
      summary: Delete a unit (soft delete), only when nothing uses it
      description: Refused with 409 IN_USE while it has children, accounts, facilities or records; details.uses says what.
      operationId: deleteUnit
      parameters:
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /admin/hospitals:
    get:
      tags: [Admin]
      summary: List hospitals (M10 FE-3)
      operationId: listHospitals
      parameters:
        - name: districtId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Part of the name or type.
          schema:
            type: string
      responses:
        '200':
          description: Hospitals, ordered by district and name.
          content:
            application/json:
              schema:
                type: object
                required: [facilities]
                properties:
                  facilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facility'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Admin]
      summary: Add a hospital
      description: Each serves a district, and optionally one area in it. The server numbers it (serverSeq), so phones can pull it later (M5 FE-1).
      operationId: createHospital
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityInput'
      responses:
        '201':
          $ref: '#/components/responses/FacilityResult'
        '400':
          description: VALIDATION_ERROR, UNKNOWN_DISTRICT or AREA_NOT_IN_DISTRICT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /admin/hospitals/{id}:
    patch:
      tags: [Admin]
      summary: Change a hospital
      operationId: updateHospital
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityInput'
      responses:
        '200':
          $ref: '#/components/responses/FacilityResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Admin]
      summary: Delete a hospital (soft delete)
      operationId: deleteHospital
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/Error'

  /admin/referral-centres:
    get:
      tags: [Admin]
      summary: List referral centres (M10 FE-3)
      operationId: listReferralCentres
      parameters:
        - name: districtId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Part of the name or type.
          schema:
            type: string
      responses:
        '200':
          description: Referral centres, ordered by district and name.
          content:
            application/json:
              schema:
                type: object
                required: [facilities]
                properties:
                  facilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Facility'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Admin]
      summary: Add a referral centre
      description: A referral centre needs a type, for example Nutrition Rehabilitation Centre. The server numbers it (serverSeq), so phones can pull it later (M5 FE-1).
      operationId: createReferralCentre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityInput'
      responses:
        '201':
          $ref: '#/components/responses/FacilityResult'
        '400':
          description: VALIDATION_ERROR, UNKNOWN_DISTRICT or AREA_NOT_IN_DISTRICT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /admin/referral-centres/{id}:
    patch:
      tags: [Admin]
      summary: Change a referral centre
      operationId: updateReferralCentre
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityInput'
      responses:
        '200':
          $ref: '#/components/responses/FacilityResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Admin]
      summary: Delete a referral centre (soft delete)
      operationId: deleteReferralCentre
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/Error'

  /admin/audit:
    get:
      tags: [Audit]
      summary: The audit log, newest first (M10 FE-3)
      description: Every create, edit, delete, referral, alert, login and sync conflict, with the user and time. Dates are whole days, Pakistan time. Page back with `before` = `nextBefore`.
      operationId: listAudit
      parameters:
        - name: user
          in: query
          description: Part of the username or name of who did it.
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
            enum: [create, edit, delete, referral, alert, login, sync_conflict]
        - name: entityType
          in: query
          description: The record type (table name), for example users or visits.
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: before
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: A page of entries, with the filter choices.
          content:
            application/json:
              schema:
                type: object
                required: [entries, nextBefore, actions, entityTypes]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  nextBefore:
                    type: [integer, 'null']
                    description: Pass as `before` for the next page; null on the last page.
                  actions:
                    type: array
                    items:
                      type: string
                  entityTypes:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /pin-reset/reply-code:
    post:
      tags: [PIN reset]
      summary: The reply code that resets a forgotten PIN on an LHW's phone (M1 FE-2)
      description: |
        The phone of an LHW who forgot her PIN shows a 6-digit code. She reads it to her supervisor, who
        enters it here and reads back the 8-digit reply code. The phone checks the reply offline with the
        secret it received at activation, then lets her set a new PIN; its data is kept. Supervisors can do
        this for LHWs in their areas, admins for any LHW. Each reply code is audited (without the code).
        Formula, shared with the app: HMAC-SHA256(secret, "mediqore/pin-reset/" + challenge), first 4 bytes
        as an unsigned big-endian integer, modulo 100000000, padded to 8 digits.
      operationId: pinResetReplyCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lhwId, challenge]
              properties:
                lhwId:
                  type: string
                  format: uuid
                challenge:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: The 6-digit code on the phone (spaces are ignored).
      responses:
        '200':
          description: The reply code for the LHW's most recently activated phone.
          content:
            application/json:
              schema:
                type: object
                required: [replyCode, lhw, device]
                properties:
                  replyCode:
                    type: string
                    pattern: '^[0-9]{8}$'
                  lhw:
                    type: object
                    required: [id, fullName, lhwCode]
                    properties:
                      id:
                        type: string
                        format: uuid
                      fullName:
                        type: string
                      lhwCode:
                        type: string
                  device:
                    type: object
                    required: [model, activatedAt]
                    properties:
                      model:
                        type: [string, 'null']
                      activatedAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: NOT_FOUND (no such LHW in the viewer's areas) or NO_ACTIVATED_PHONE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Level:
      name: level
      in: path
      required: true
      schema:
        type: string
        enum: [districts, tehsils, union-councils, areas]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error response in the standard shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyAttempts:
      description: Too many failed attempts for this username from this address (TOO_MANY_ATTEMPTS).
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StaffResult:
      description: The account after the change.
      content:
        application/json:
          schema:
            type: object
            required: [staff]
            properties:
              staff:
                $ref: '#/components/schemas/Staff'
    UnitResult:
      description: The unit.
      content:
        application/json:
          schema:
            type: object
            required: [unit]
            properties:
              unit:
                type: object
                required: [id, name, parentId]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  parentId:
                    type: [string, 'null']
                    format: uuid
    FacilityResult:
      description: The hospital or referral centre.
      content:
        application/json:
          schema:
            type: object
            required: [facility]
            properties:
              facility:
                $ref: '#/components/schemas/Facility'
    LhwResult:
      description: The LHW after the change.
      content:
        application/json:
          schema:
            type: object
            required: [lhw]
            properties:
              lhw:
                $ref: '#/components/schemas/Lhw'
  schemas:
    Health:
      type: object
      required: [status, service, version, uptimeSeconds]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          example: mediqore-api
        version:
          type: string
          example: 0.1.0
        uptimeSeconds:
          type: integer
          minimum: 0

    LoginResult:
      type: object
      required: [status, accessToken, tokenType, expiresIn, refreshToken, refreshExpiresAt, user]
      properties:
        status:
          type: string
          const: ok
        accessToken:
          type: string
          description: JWT, valid for expiresIn. App tokens carry the activated phone (claim `did`).
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: string
          example: 15m
        refreshToken:
          type: string
          description: Opaque; works once with POST /auth/refresh.
        refreshExpiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserProfile'
        supervisors:
          type: array
          description: LHWs only. The supervisors of her area with a phone number, for the lock screen's emergency call.
          items:
            type: object
            required: [name, phone]
            properties:
              name:
                type: string
              phone:
                type: string

    UserProfile:
      type: object
      required: [id, username, role, fullName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [lhw, supervisor, admin]
        fullName:
          type: string
        lhwCode:
          type: string
          description: LHWs only.
        areaId:
          type: string
          format: uuid
          description: LHWs only. The app resets its local area data when this changes.
        areaName:
          type: string
        lastPatientNumber:
          type: integer
          minimum: 0
          description: |
            LHWs only. The highest number already used in a patient ID with this LHW code (M2 FE-1),
            0 if none. The app's patient counter continues after it, so a new phone never reuses an ID.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AreaOption:
      type: object
      required: [id, name, unionCouncil, tehsil, district]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unionCouncil:
          type: string
        tehsil:
          type: string
        district:
          type: string

    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Lhw:
      type: object
      required: [id, lhwCode, username, fullName, isActive, area, devices, activationCodeExpiresAt]
      properties:
        id:
          type: string
          format: uuid
        lhwCode:
          type: string
          example: LHW-00001
        username:
          type: string
        fullName:
          type: string
        phone:
          type: [string, 'null']
        isActive:
          type: boolean
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        area:
          type: object
          required: [id, name, unionCouncil, tehsil, district]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            unionCouncil:
              $ref: '#/components/schemas/NamedRef'
            tehsil:
              $ref: '#/components/schemas/NamedRef'
            district:
              $ref: '#/components/schemas/NamedRef'
        devices:
          type: object
          required: [activated, lastActivatedAt]
          properties:
            activated:
              type: integer
              description: Activated phones that are not blocked.
            lastActivatedAt:
              type: [string, 'null']
              format: date-time
        activationCodeExpiresAt:
          type: [string, 'null']
          format: date-time
          description: Set while an unused activation code is valid.

    LhwWithCredentials:
      type: object
      required: [lhw, credentials]
      properties:
        lhw:
          $ref: '#/components/schemas/Lhw'
        credentials:
          type: object
          required: [username, password]
          description: Shown to the admin once; never stored in plain text.
          properties:
            username:
              type: string
            password:
              type: string

    Staff:
      type: object
      required: [id, role, username, fullName, isActive, areas]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [supervisor, admin]
        username:
          type: string
        fullName:
          type: string
        phone:
          type: [string, 'null']
        isActive:
          type: boolean
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        areas:
          type: array
          description: A supervisor's areas; empty for an admin.
          items:
            $ref: '#/components/schemas/AreaOption'

    StaffWithCredentials:
      type: object
      required: [staff, credentials]
      properties:
        staff:
          $ref: '#/components/schemas/Staff'
        credentials:
          type: object
          required: [username, password]
          description: Shown to the admin once; never stored in plain text.
          properties:
            username:
              type: string
            password:
              type: string

    GeographyTree:
      type: object
      required: [districts]
      properties:
        districts:
          type: array
          items:
            type: object
            required: [id, name, tehsils]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              tehsils:
                type: array
                items:
                  type: object
                  required: [id, name, unionCouncils]
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    unionCouncils:
                      type: array
                      items:
                        type: object
                        required: [id, name, areas]
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          areas:
                            type: array
                            items:
                              type: object
                              required: [id, name, lhws, supervisors]
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
                                lhws:
                                  type: integer
                                supervisors:
                                  type: integer

    FacilityInput:
      type: object
      description: Required on create - name, districtId, and type for a referral centre. Give latitude and longitude together. Empty text is stored as null.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        type:
          type: [string, 'null']
          description: Hospital - for example DHQ or THQ. Referral centre - for example Nutrition Rehabilitation Centre.
        districtId:
          type: string
          format: uuid
        areaId:
          type: [string, 'null']
          format: uuid
          description: Optional; must be in the district.
        address:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']

    Facility:
      type: object
      required: [id, name, district, serverSeq]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: [string, 'null']
        address:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        district:
          $ref: '#/components/schemas/NamedRef'
        area:
          oneOf:
            - $ref: '#/components/schemas/NamedRef'
            - type: 'null'
        serverSeq:
          type: integer
        updatedAt:
          type: string
          format: date-time

    AuditEntry:
      type: object
      required: [id, occurredAt, action, details]
      properties:
        id:
          type: integer
        occurredAt:
          type: string
          format: date-time
        action:
          type: string
          enum: [create, edit, delete, referral, alert, login, sync_conflict]
        entityType:
          type: [string, 'null']
        entityId:
          type: [string, 'null']
          format: uuid
        entityLabel:
          type: [string, 'null']
          description: For accounts, the username.
        deviceId:
          type: [string, 'null']
          format: uuid
        details:
          type: object
        user:
          description: Who did it; null when unknown, for example a failed sign-in.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, username, fullName, role]
              properties:
                id:
                  type: string
                  format: uuid
                username:
                  type: string
                fullName:
                  type: string
                role:
                  type: string

    LhwActivity:
      type: object
      required: [id, lhwCode, fullName, isActive, area, unionCouncil, district, visitsThisWeek, visitsTotal, womenRegistered]
      properties:
        id:
          type: string
          format: uuid
        lhwCode:
          type: string
        fullName:
          type: string
        isActive:
          type: boolean
        area:
          type: string
        unionCouncil:
          type: string
        district:
          type: string
        visitsThisWeek:
          type: integer
          description: This week starts on Monday, Pakistan time.
        visitsTotal:
          type: integer
        womenRegistered:
          type: integer
        lastVisitAt:
          type: [string, 'null']
          format: date-time
          description: The phone's clock.
        lastSyncAt:
          type: [string, 'null']
          format: date-time
          description: When the server last received one of her records.
        lastLoginAt:
          type: [string, 'null']
          format: date-time

    DashboardFilters:
      type: object
      required: [districts, unionCouncils, lhws]
      properties:
        districts:
          type: array
          items:
            $ref: '#/components/schemas/NamedRef'
        unionCouncils:
          type: array
          items:
            type: object
            required: [id, name, districtId]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              districtId:
                type: string
                format: uuid
        lhws:
          type: array
          items:
            type: object
            required: [id, lhwCode, fullName, unionCouncilId, districtId]
            properties:
              id:
                type: string
                format: uuid
              lhwCode:
                type: string
              fullName:
                type: string
              unionCouncilId:
                type: string
                format: uuid
              districtId:
                type: string
                format: uuid

    HouseholdData:
      type: object
      description: Fields of a household (M2 FE-3). Missing or empty fields are stored as null.
      properties:
        householdNumber:
          type: [string, 'null']
          maxLength: 50
        address:
          type: [string, 'null']
          maxLength: 500
        village:
          type: [string, 'null']
          maxLength: 200
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          description: Rounded to 6 decimal places. Give latitude and longitude together.
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180

    WomanData:
      type: object
      description: A registered woman (M2 FE-1).
      required: [householdId, patientCode, name]
      properties:
        householdId:
          type: string
          format: uuid
        patientCode:
          type: string
          maxLength: 40
          pattern: '^[A-Za-z0-9-]+$'
          description: The LHW code plus a counter kept on the phone, for example LHW-00001-0007. Unique.
        name:
          type: string
          maxLength: 200
        age:
          type: [integer, 'null']
          minimum: 10
          maximum: 60
        husbandName:
          type: [string, 'null']
          maxLength: 200
        contactNumber:
          type: [string, 'null']
          maxLength: 20
          pattern: '^[0-9+\- ]+$'

    PregnancyData:
      type: object
      description: The pregnancy file (M2 FE-1). One active pregnancy per woman at a time.
      required: [womanId, registeredOn, pregnancyMonthAtRegistration]
      properties:
        womanId:
          type: string
          format: uuid
        registeredOn:
          type: string
          format: date
        pregnancyMonthAtRegistration:
          type: integer
          minimum: 1
          maximum: 10
        status:
          type: string
          enum: [active, closed]
          default: active
        closedOn:
          type: [string, 'null']
          format: date
          description: Only for a closed pregnancy.

    ObstetricHistoryData:
      type: object
      description: Obstetric history at registration, the baseline risk profile (M2 FE-2). One per woman.
      required: [womanId]
      properties:
        womanId:
          type: string
          format: uuid
        previousPregnancies:
          type: integer
          minimum: 0
          maximum: 30
          default: 0
        previousCSections:
          type: integer
          minimum: 0
          maximum: 30
          default: 0
          description: At most previousPregnancies.
        stillbirths:
          type: integer
          minimum: 0
          maximum: 30
          default: 0
          description: At most previousPregnancies.
        knownConditions:
          type: [string, 'null']
          maxLength: 1000

    VisitData:
      type: object
      description: |
        One home visit (M3 FE-1). Units are in the names and never converted in storage. The bounds
        only refuse impossible values; the app asks for confirmation of implausible ones.
      required: [pregnancyId, visitedAt]
      properties:
        pregnancyId:
          type: string
          format: uuid
        visitedAt:
          type: string
          format: date-time
          description: Device clock; shown and counted, never used to order records (LI-7).
        systolicBpMmhg:
          type: [integer, 'null']
          minimum: 20
          maximum: 300
        diastolicBpMmhg:
          type: [integer, 'null']
          minimum: 10
          maximum: 200
        weightKg:
          type: [number, 'null']
          minimum: 10
          maximum: 250
        temperatureC:
          type: [number, 'null']
          minimum: 25
          maximum: 45
        pulseBpm:
          type: [integer, 'null']
          minimum: 20
          maximum: 250
        bloodSugarMmolL:
          type: [number, 'null']
          minimum: 0.5
          maximum: 50
        fetalMovement:
          type: [string, 'null']
          enum: [normal, reduced, absent, null]
        swelling:
          type: boolean
          default: false
        bleeding:
          type: boolean
          default: false
        fever:
          type: boolean
          default: false
        anaemiaSigns:
          type: string
          enum: [none, present, severe]
          default: none
        urineSymptoms:
          type: boolean
          default: false

    Conflict:
      type: object
      required: [id, table, reason, status, createdAt, areaId, areaName, submittedBy, incoming]
      properties:
        id:
          type: string
          format: uuid
        table:
          type: string
          enum: [visits]
        reason:
          type: string
          enum: [same_parent_same_day]
        status:
          type: string
          enum: [pending, resolved]
        resolution:
          type: [string, 'null']
          enum: [keep_both, keep_existing, keep_incoming, null]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, 'null']
          format: date-time
        resolvedBy:
          type: [string, 'null']
        areaId:
          type: string
          format: uuid
        areaName:
          type: string
        submittedBy:
          type: object
          properties:
            lhwCode:
              type: [string, 'null']
            fullName:
              type: [string, 'null']
        woman:
          type: [object, 'null']
          properties:
            name:
              type: string
            patientCode:
              type: string
        incoming:
          type: object
          description: The held record as the device sent it.
          properties:
            id:
              type: string
              format: uuid
            data:
              $ref: '#/components/schemas/VisitData'
        existing:
          type: [object, 'null']
          description: The record already on the server for the same day.
          properties:
            id:
              type: string
              format: uuid
            deleted:
              type: boolean
            data:
              $ref: '#/components/schemas/VisitData'

    RecordData:
      description: The fields of the record; which schema applies depends on `table`.
      anyOf:
        - $ref: '#/components/schemas/HouseholdData'
        - $ref: '#/components/schemas/WomanData'
        - $ref: '#/components/schemas/PregnancyData'
        - $ref: '#/components/schemas/ObstetricHistoryData'
        - $ref: '#/components/schemas/VisitData'

    SyncPushRequest:
      type: object
      required: [deviceId, records]
      properties:
        deviceId:
          type: string
          format: uuid
          description: UUID v4 generated once per app installation.
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [table, id, createdOnDevice, data]
            properties:
              table:
                type: string
                enum: [households, women, pregnancies, obstetric_history, visits]
                description: Tables are added as their modules are built.
              id:
                type: string
                format: uuid
                description: UUID v4 generated on the device.
              areaId:
                type: string
                format: uuid
                description: The area the record was made in (the signed-in LHW's area at that time). Ignored for a record the server already has.
              createdOnDevice:
                type: string
                format: date-time
                description: Device clock at creation; informational only.
              deleted:
                type: boolean
                default: false
              data:
                $ref: '#/components/schemas/RecordData'

    SyncPushResult:
      type: object
      required: [table, id, status]
      properties:
        table:
          type: string
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, updated, unchanged, rejected, conflict]
        serverSeq:
          type: integer
          description: Absent when rejected or held as a conflict.
        conflictId:
          type: string
          format: uuid
          description: With status `conflict`, the item in the supervisor's queue.
        reason:
          type: string
          enum: [OUT_OF_AREA, MISSING_PARENT, DUPLICATE_PATIENT_ID, ACTIVE_PREGNANCY_EXISTS, DUPLICATE_RECORD, INVALID_VALUE]

    SyncRecord:
      type: object
      required: [table, id, areaId, serverSeq, deleted, data]
      properties:
        table:
          type: string
        id:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        serverSeq:
          type: integer
        createdOnDevice:
          type: [string, 'null']
          format: date-time
        syncedAt:
          type: string
          format: date-time
        deleted:
          type: boolean
        data:
          $ref: '#/components/schemas/RecordData'

    RegisteredWoman:
      type: object
      required: [id, patientCode, name, areaId, areaName, household, registeredBy, serverSeq, syncedAt]
      properties:
        id:
          type: string
          format: uuid
        patientCode:
          type: string
        name:
          type: string
        age:
          type: [integer, 'null']
        husbandName:
          type: [string, 'null']
        contactNumber:
          type: [string, 'null']
        areaId:
          type: string
          format: uuid
        areaName:
          type: string
        household:
          type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
            village:
              type: [string, 'null']
            address:
              type: [string, 'null']
            latitude:
              type: [number, 'null']
            longitude:
              type: [number, 'null']
        registeredBy:
          type: object
          description: The LHW who registered her.
          properties:
            lhwCode:
              type: [string, 'null']
            fullName:
              type: string
        pregnancy:
          type: [object, 'null']
          properties:
            registeredOn:
              type: string
              format: date
            monthAtRegistration:
              type: integer
            status:
              type: string
              enum: [active, closed]
        obstetricHistory:
          type: [object, 'null']
          properties:
            previousPregnancies:
              type: integer
            previousCSections:
              type: integer
            stillbirths:
              type: integer
            knownConditions:
              type: [string, 'null']
        visits:
          type: object
          description: Her home visits (M3 FE-1), deleted ones left out.
          properties:
            count:
              type: integer
            lastVisitAt:
              type: [string, 'null']
              format: date-time
        serverSeq:
          type: integer
        syncedAt:
          type: string
          format: date-time

    Household:
      type: object
      required: [id, areaId, areaName, serverSeq, syncedAt]
      properties:
        id:
          type: string
          format: uuid
        householdNumber:
          type: [string, 'null']
        village:
          type: [string, 'null']
        address:
          type: [string, 'null']
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        areaId:
          type: string
          format: uuid
        areaName:
          type: string
        unionCouncilName:
          type: string
        registeredBy:
          type: [string, 'null']
          description: LHW ID of the LHW who registered it.
        serverSeq:
          type: integer
        syncedAt:
          type: string
          format: date-time
        createdOnDevice:
          type: [string, 'null']
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum:
                - VALIDATION_ERROR
                - INVALID_JSON
                - PAYLOAD_TOO_LARGE
                - NOT_FOUND
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - NO_AREA
                - DEVICE_NOT_ALLOWED
                - DEVICE_REQUIRED
                - ACCOUNT_INACTIVE
                - ACTIVATION_REQUIRED
                - ACTIVATION_CODE_INVALID
                - APP_FOR_LHWS
                - NO_ACTIVATED_PHONE
                - INVALID_REFRESH_TOKEN
                - TOO_MANY_ATTEMPTS
                - HTTPS_REQUIRED
                - UNKNOWN_AREA
                - ALREADY_RESOLVED
                - UNKNOWN_PARENT
                - DUPLICATE_NAME
                - IN_USE
                - USERNAME_TAKEN
                - AREAS_REQUIRED
                - OWN_ACCOUNT
                - LAST_ADMIN
                - UNKNOWN_DISTRICT
                - AREA_NOT_IN_DISTRICT
                - INTERNAL_ERROR
            message:
              type: string
            details:
              description: For VALIDATION_ERROR, one entry per problem. For IN_USE, `uses` lists what still uses the record.
              oneOf:
                - type: array
                  items:
                    type: object
                    required: [in, path, message]
                    properties:
                      in:
                        type: string
                        enum: [params, query, body]
                      path:
                        type: string
                      message:
                        type: string
                - type: object
                  properties:
                    uses:
                      type: array
                      items:
                        type: string
