# flutter gen-l10n settings. Every visible string lives in lib/l10n/*.arb,
# with an English (template) and an Urdu entry. Never put visible text in Dart code.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
required-resource-attributes: true
