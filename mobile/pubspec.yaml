name: mediqore
description: "MediQore LHW app: offline, Urdu, Android only (LI-1)."
publish_to: 'none'

version: 0.1.0+1

environment:
  # Flutter 3.47.0 (Dart 3.13.0) or any newer stable release. Older Flutter versions cannot
  # resolve build_runner 2.16 and drift_dev 2.35, which need meta 1.18.3 or newer.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  # Jameel Noori Nastaleeq (scope Tools table: bundled Urdu font), used by
  # AppTheme for all text. See assets/fonts/README.md.
  fonts:
    - family: JameelNooriNastaleeq
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeq.ttf
